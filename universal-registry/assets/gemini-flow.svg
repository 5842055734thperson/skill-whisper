<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --color-page: #0a0a0a;
        --color-paper: #141414;
        --color-bar: #1b1b1b;
        --color-border: #2b2b2b;
        --color-ink: #f5f5f5;
        --color-muted: #9a9a9a;
        --color-soft: #5c5c5c;
        --color-accent: #ff5a36;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --color-page: #f5f5f5;
          --color-paper: #ffffff;
          --color-bar: #eeeeee;
          --color-border: #d0d7de;
          --color-ink: #111111;
          --color-muted: #555555;
          --color-soft: #888888;
          --color-accent: #eb6c36;
        }
      }

      .mono {
        font-family: ui-monospace, "SF Mono", "Geist Mono", "Cascadia Code", monospace;
        font-size: 13.5px;
        fill: var(--color-ink);
      }
      .dim { fill: var(--color-muted); }
      .soft { fill: var(--color-soft); }
      .accent { fill: var(--color-accent); }
      .border-line { stroke: var(--color-border); stroke-width: 1; }
      .accent-line { stroke: var(--color-accent); stroke-width: 2; }
      .dashed-box {
        stroke: var(--color-border);
        stroke-width: 1;
        stroke-dasharray: 4 4;
        fill: var(--color-bar);
      }
      .solid-box {
        stroke: var(--color-border);
        stroke-width: 1;
        fill: var(--color-bar);
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 0.8s infinite; }

      @keyframes animPhase1 {
        0%, 31% { opacity: 1; visibility: visible; }
        33%, 98% { opacity: 0; visibility: hidden; }
        100% { opacity: 1; visibility: visible; }
      }
      @keyframes animPhase2 {
        0%, 33% { opacity: 0; visibility: hidden; }
        35%, 64% { opacity: 1; visibility: visible; }
        66%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes animPhase3 {
        0%, 66% { opacity: 0; visibility: hidden; }
        68%, 97% { opacity: 1; visibility: visible; }
        99%, 100% { opacity: 0; visibility: hidden; }
      }

      .phase-1 { animation: animPhase1 8.5s infinite; }
      .phase-2 { animation: animPhase2 8.5s infinite; }
      .phase-3 { animation: animPhase3 8.5s infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="var(--color-paper)" rx="8" />
  <rect x="15" y="15" width="710" height="310" rx="8" fill="none" class="border-line" />

  <!-- Terminal Window Titlebar (from diagram-design primitive-terminal.md) -->
  <line x1="15" y1="48" x2="725" y2="48" class="border-line" />
  <circle cx="36" cy="32" r="4.5" fill="var(--color-accent)" />
  <circle cx="50" cy="32" r="4.5" fill="var(--color-soft)" />
  <circle cx="64" cy="32" r="4.5" fill="var(--color-soft)" />
  <text x="84" y="36" class="mono" font-size="11.5" letter-spacing="0.5">gemini-cli — autonomous-discovery.sh</text>
  <text x="605" y="36" class="mono dim" font-size="11">rules/AGENTS.md</text>

  <!-- Session Subtitle -->
  <text x="36" y="74" class="mono dim" font-size="12">gemini-cli --agent antigravity</text>
  <text x="36" y="94" class="mono soft" font-size="11">─── Skill Whisper Mandate Active · Cross-Lingual Intent Engine ───</text>

  <!-- Fixed Chat Input Baseline -->
  <line x1="36" y1="134" x2="704" y2="134" class="border-line" />
  <text x="36" y="122" class="mono" font-size="15">&gt;</text>
  <text x="56" y="122" class="mono">build contract tests and mock server for this REST API</text>

  <!-- ================= PHASE 1: NATURAL INTENT SCAN ================= -->
  <g class="phase-1">
    <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.31;0.33;0.66;0.68;0.98;1" dur="8.5s" repeatCount="indefinite" />
    <line x1="495" y1="110" x2="495" y2="126" class="accent-line cursor" />

    <!-- Intent Scan Box -->
    <rect x="36" y="152" width="668" height="68" rx="6" class="dashed-box" />
    <text x="52" y="180" class="mono" font-size="12.5">🔍 Autonomous Skill Scan in Progress...</text>
    <text x="52" y="204" class="mono soft" font-size="11">Detected Intent: "REST API", "contract test", "mock" → [postman:api-engineer]</text>

    <!-- Status Footer -->
    <text x="36" y="254" class="mono soft" font-size="11">[Rule 1: No slash command required · Natural language prompt auto-routed]</text>
  </g>

  <!-- ================= PHASE 2: MANDATE ANNOUNCEMENT ================= -->
  <g class="phase-2">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.33;0.35;0.64;0.66;0.98;1" dur="8.5s" repeatCount="indefinite" />
    <!-- Mandate Box -->
    <rect x="36" y="152" width="668" height="68" rx="6" class="solid-box" />
    <text x="52" y="180" class="mono" font-size="12.5">💬 Skill: <tspan class="accent" font-weight="600">postman:api-engineer</tspan> <tspan class="dim">— API Contract Testing &amp; Mocking</tspan></text>
    <text x="52" y="204" class="mono dim" font-size="11">Mandate: Must announce expert skill and read runbook before writing code.</text>

    <!-- Status Footer -->
    <text x="36" y="254" class="mono soft" font-size="11">[Rule 2: Improvisation intercepted · Bound to postman expert runbook]</text>
  </g>

  <!-- ================= PHASE 3: RUNBOOK EXECUTION ================= -->
  <g class="phase-3">
    <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.66;0.68;0.97;0.98;1;1" dur="8.5s" repeatCount="indefinite" />
    <!-- Action Plan Box -->
    <rect x="36" y="152" width="668" height="68" rx="6" class="solid-box" />
    <text x="52" y="180" class="mono" font-size="12.5">1. read_file(".../plugins/postman/skills/api-engineer/SKILL.md")</text>
    <text x="52" y="204" class="mono dim" font-size="11">2. Enforced Postman collection assertions and mock contract standards.</text>

    <!-- Status Footer -->
    <text x="36" y="254" class="mono" font-size="11">✔ Autonomous execution complete · Zero hallucination, 100% compliant</text>
  </g>

  <!-- Corner Accents -->
  <line x1="22" y1="305" x2="30" y2="305" class="border-line" />
  <line x1="22" y1="305" x2="22" y2="297" class="border-line" />
  <line x1="718" y1="305" x2="710" y2="305" class="border-line" />
  <line x1="718" y1="305" x2="718" y2="297" class="border-line" />
</svg>