<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --color-page: #0a0a0a;
        --color-paper: #141414;
        --color-bar: #1b1b1b;
        --color-border: #2b2b2b;
        --color-ink: #f5f5f5;
        --color-muted: #9a9a9a;
        --color-soft: #5c5c5c;
        --color-accent: #ff5a36;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --color-page: #f5f5f5;
          --color-paper: #ffffff;
          --color-bar: #eeeeee;
          --color-border: #d0d7de;
          --color-ink: #111111;
          --color-muted: #555555;
          --color-soft: #888888;
          --color-accent: #eb6c36;
        }
      }

      .mono {
        font-family: ui-monospace, "SF Mono", "Geist Mono", "Cascadia Code", monospace;
        font-size: 13.5px;
        fill: var(--color-ink);
      }
      .dim { fill: var(--color-muted); }
      .soft { fill: var(--color-soft); }
      .accent { fill: var(--color-accent); }
      .border-line { stroke: var(--color-border); stroke-width: 1; }
      .accent-line { stroke: var(--color-accent); stroke-width: 2; }
      .dashed-box {
        stroke: var(--color-border);
        stroke-width: 1;
        stroke-dasharray: 4 4;
        fill: var(--color-bar);
      }
      .solid-box {
        stroke: var(--color-border);
        stroke-width: 1;
        fill: var(--color-bar);
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 0.8s infinite; }

      @keyframes animPhase1 {
        0%, 31% { opacity: 1; visibility: visible; }
        33%, 98% { opacity: 0; visibility: hidden; }
        100% { opacity: 1; visibility: visible; }
      }
      @keyframes animPhase2 {
        0%, 33% { opacity: 0; visibility: hidden; }
        35%, 64% { opacity: 1; visibility: visible; }
        66%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes animPhase3 {
        0%, 66% { opacity: 0; visibility: hidden; }
        68%, 97% { opacity: 1; visibility: visible; }
        99%, 100% { opacity: 0; visibility: hidden; }
      }

      .phase-1 { animation: animPhase1 8.5s infinite; }
      .phase-2 { animation: animPhase2 8.5s infinite; }
      .phase-3 { animation: animPhase3 8.5s infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="var(--color-paper)" rx="8" />
  <rect x="15" y="15" width="710" height="310" rx="8" fill="none" class="border-line" />

  <!-- Terminal Window Titlebar (from diagram-design primitive-terminal.md) -->
  <line x1="15" y1="48" x2="725" y2="48" class="border-line" />
  <circle cx="36" cy="32" r="4.5" fill="var(--color-accent)" />
  <circle cx="50" cy="32" r="4.5" fill="var(--color-soft)" />
  <circle cx="64" cy="32" r="4.5" fill="var(--color-soft)" />
  <text x="84" y="36" class="mono" font-size="11.5" letter-spacing="0.5">copilot — matrix-governance.sh</text>
  <text x="515" y="36" class="mono dim" font-size="11">.github/copilot-instructions.md</text>

  <!-- Session Subtitle -->
  <text x="36" y="74" class="mono dim" font-size="12">editor: src/deploy/canary.ts</text>
  <text x="36" y="94" class="mono soft" font-size="11">─── Copilot Instruction Matrix Active · Runbook-Governed Completion ───</text>

  <!-- Fixed Editor Baseline -->
  <line x1="36" y1="134" x2="704" y2="134" class="border-line" />
  <text x="36" y="122" class="mono">// Prompt: build kubernetes canary rollback deployment</text>

  <!-- ================= PHASE 1: MATRIX SCAN ================= -->
  <g class="phase-1">
    <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.31;0.33;0.66;0.68;0.98;1" dur="8.5s" repeatCount="indefinite" />
    <line x1="518" y1="110" x2="518" y2="126" class="accent-line cursor" />

    <!-- Matrix Scan Box -->
    <rect x="36" y="152" width="668" height="68" rx="6" class="dashed-box" />
    <text x="52" y="180" class="mono" font-size="12.5">🧭 Matrix Scan: Scanning .github/copilot-instructions.md...</text>
    <text x="52" y="204" class="mono soft" font-size="11">Matched Tokens: "kubernetes", "canary rollback", "drain pods" (Matrix lookup)</text>

    <!-- Status Footer -->
    <text x="36" y="254" class="mono soft" font-size="11">[Matrix Check: Matching runbook rules across 347 universal skills]</text>
  </g>

  <!-- ================= PHASE 2: ROUTING TABLE MATCH ================= -->
  <g class="phase-2">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.33;0.35;0.64;0.66;0.98;1" dur="8.5s" repeatCount="indefinite" />
    <!-- Table Box -->
    <rect x="36" y="152" width="668" height="68" rx="6" class="solid-box" />
    <line x1="36" y1="180" x2="704" y2="180" class="border-line" stroke-dasharray="4 4" />
    <line x1="160" y1="152" x2="160" y2="220" class="border-line" stroke-dasharray="4 4" />
    <line x1="360" y1="152" x2="360" y2="220" class="border-line" stroke-dasharray="4 4" />

    <!-- Headers -->
    <text x="48" y="172" class="mono soft" font-size="11">PLUGIN</text>
    <text x="172" y="172" class="mono soft" font-size="11">MATCHED SKILL</text>
    <text x="372" y="172" class="mono soft" font-size="11">TRIGGER INTENT</text>

    <!-- Row Data -->
    <text x="48" y="204" class="mono" font-size="12">acme-devops</text>
    <text x="172" y="204" class="mono accent" font-size="12" font-weight="600">k8s-canary-rollback</text>
    <text x="372" y="204" class="mono dim" font-size="11">canary rollback, drain pods, restore traffic</text>

    <!-- Status Footer -->
    <text x="36" y="254" class="mono soft" font-size="11">[Matrix Matched: Improvisation prevented · Team runbook standard selected]</text>
  </g>

  <!-- ================= PHASE 3: CODE COMPLETION ================= -->
  <g class="phase-3">
    <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.66;0.68;0.97;0.98;1;1" dur="8.5s" repeatCount="indefinite" />
    <!-- Code Box -->
    <rect x="36" y="152" width="668" height="68" rx="6" class="solid-box" />
    <text x="52" y="180" class="mono" font-size="12">14 | const canary = await k8s.getCanaryDeployment('service-api');</text>
    <text x="52" y="204" class="mono" font-size="12">15 | if (canary.errorRate &gt; 0.05) await drainPodsAndRestoreTraffic();</text>

    <!-- Status Footer -->
    <text x="36" y="254" class="mono" font-size="11">✔ Verified Completion: Generated validated runbook code over raw script</text>
  </g>

  <!-- Corner Accents -->
  <line x1="22" y1="305" x2="30" y2="305" class="border-line" />
  <line x1="22" y1="305" x2="22" y2="297" class="border-line" />
  <line x1="718" y1="305" x2="710" y2="305" class="border-line" />
  <line x1="718" y1="305" x2="718" y2="297" class="border-line" />
</svg>